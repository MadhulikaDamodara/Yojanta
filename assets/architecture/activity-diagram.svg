<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Yojanta activity diagram — main user flow</title>
  <desc>Shows the complete user activity flow from visiting Yojanta through registration, profile setup, dashboard, scheme discovery, opting in, and tracking applications</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Yojanta — Activity Diagram</text>

  <!-- START -->
  <circle cx="340" cy="54" r="14" fill="#2C2C2A"/>
  <line x1="340" y1="68" x2="340" y2="88" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Visit Yojanta -->
  <rect x="240" y="88" width="200" height="36" rx="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#0C447C">Visit Yojanta</text>
  <line x1="340" y1="124" x2="340" y2="144" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Account? -->
  <polygon points="340,144 400,172 340,200 280,172" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2C2C2A">Has account?</text>

  <!-- No branch → Register -->
  <line x1="280" y1="172" x2="160" y2="172" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="214" y="164" font-family="Arial,sans-serif" font-size="10" fill="#888">No</text>
  <rect x="60" y="155" width="100" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="110" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#085041">Register</text>
  <line x1="110" y1="189" x2="110" y2="236" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes branch → Login -->
  <line x1="400" y1="172" x2="520" y2="172" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="454" y="164" font-family="Arial,sans-serif" font-size="10" fill="#888">Yes</text>
  <rect x="520" y="155" width="100" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="570" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#085041">Login</text>
  <line x1="570" y1="189" x2="570" y2="222" stroke="#444441" stroke-width="1.5"/>
  <line x1="570" y1="222" x2="340" y2="222" stroke="#444441" stroke-width="1.5"/>
  <line x1="340" y1="222" x2="340" y2="236" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- JWT Issued -->
  <rect x="240" y="236" width="200" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="340" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#27500A">JWT Token Issued</text>
  <line x1="340" y1="272" x2="340" y2="292" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Profile complete? -->
  <polygon points="340,292 410,320 340,348 270,320" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2C2C2A">Profile complete?</text>

  <!-- No → Fill Profile -->
  <line x1="270" y1="320" x2="160" y2="320" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="207" y="312" font-family="Arial,sans-serif" font-size="10" fill="#888">No</text>
  <rect x="60" y="303" width="100" height="34" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="110" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#633806">Fill Profile</text>
  <line x1="110" y1="337" x2="110" y2="370" stroke="#444441" stroke-width="1.5"/>
  <line x1="110" y1="370" x2="270" y2="370" stroke="#444441" stroke-width="1.5"/>
  <line x1="270" y1="370" x2="270" y2="348" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes → Dashboard -->
  <line x1="340" y1="348" x2="340" y2="396" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="372" font-family="Arial,sans-serif" font-size="10" fill="#888">Yes</text>

  <!-- Dashboard -->
  <rect x="220" y="396" width="240" height="42" rx="8" fill="#185FA5"/>
  <text x="340" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">Dashboard</text>
  <text x="340" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#B5D4F4">Eligible schemes displayed</text>
  <line x1="340" y1="438" x2="340" y2="458" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: User action? -->
  <polygon points="340,458 420,490 340,522 260,490" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2C2C2A">User action?</text>

  <!-- Search -->
  <line x1="260" y1="490" x2="100" y2="490" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="482" font-family="Arial,sans-serif" font-size="10" fill="#888">Search</text>
  <rect x="30" y="473" width="70" height="34" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="65" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#0C447C">Filter</text>
  <path d="M65 507 L65 530 L260 530 L260 510" fill="none" stroke="#444441" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- Opt In -->
  <line x1="340" y1="522" x2="340" y2="556" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="541" font-family="Arial,sans-serif" font-size="10" fill="#888">Opt In</text>
  <rect x="220" y="556" width="240" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="579" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#085041">Scheme added to Tracker</text>
  <line x1="340" y1="592" x2="340" y2="620" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Chatbot -->
  <line x1="420" y1="490" x2="570" y2="490" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="488" y="482" font-family="Arial,sans-serif" font-size="10" fill="#888">Chatbot</text>
  <rect x="570" y="473" width="80" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="610" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#3C3489">Ask AI</text>
  <path d="M610 507 L610 620 L460 620" fill="none" stroke="#444441" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- Update Status -->
  <rect x="220" y="620" width="240" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="340" y="643" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#633806">Update Status → applied / approved</text>
  <line x1="340" y1="656" x2="340" y2="690" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Logout -->
  <rect x="250" y="690" width="180" height="36" rx="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#2C2C2A">Logout / Session Ends</text>
  <line x1="340" y1="726" x2="340" y2="748" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- END -->
  <circle cx="340" cy="762" r="12" fill="none" stroke="#2C2C2A" stroke-width="2"/>
  <circle cx="340" cy="762" r="7" fill="#2C2C2A"/>
</svg>
