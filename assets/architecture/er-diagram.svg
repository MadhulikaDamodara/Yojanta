<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Yojanta ER diagram</title>
  <desc>Entity relationship diagram showing users, schemes and opted_schemes collections with their fields and relationships</desc>
  <defs>
    <marker id="arr-many" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 2 L10 6 L0 10" fill="none" stroke="#888780" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#888780" stroke-width="1.2"/>
    </marker>
    <marker id="arr-one" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <line x1="8" y1="0" x2="8" y2="12" stroke="#888780" stroke-width="1.2"/>
      <line x1="10" y1="0" x2="10" y2="12" stroke="#888780" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Yojanta — Entity Relationship Diagram</text>

  <!-- ── USERS TABLE ──────────────────────── -->
  <rect x="30" y="50" width="185" height="380" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <rect x="30" y="50" width="185" height="36" rx="8" fill="#185FA5"/>
  <rect x="30" y="78" width="185" height="8" fill="#185FA5"/>
  <text x="122" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">users</text>

  <!-- PK row -->
  <rect x="38" y="92" width="169" height="22" rx="4" fill="#B5D4F4"/>
  <text x="48" y="107" font-family="Arial,sans-serif" font-size="10" fill="#0C447C" font-weight="600">PK  _id : ObjectId</text>

  <line x1="38" y1="116" x2="207" y2="116" stroke="#185FA5" stroke-width="0.5"/>

  <text x="48" y="131" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">user_name : String  UK</text>
  <text x="48" y="147" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">email : String  UK IDX</text>
  <text x="48" y="163" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">password : String  bcrypt</text>
  <text x="48" y="179" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">name : String</text>
  <text x="48" y="195" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">dob : Date</text>
  <text x="48" y="211" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">gender : Enum</text>
  <text x="48" y="227" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">income : Number</text>
  <text x="48" y="243" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">occupation : String</text>
  <text x="48" y="259" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">state : String</text>
  <text x="48" y="275" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">category : Enum</text>
  <text x="48" y="291" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">created_at : Date</text>

  <!-- ── OPTED_SCHEMES TABLE ──────────────── -->
  <rect x="248" y="100" width="185" height="220" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <rect x="248" y="100" width="185" height="36" rx="8" fill="#854F0B"/>
  <rect x="248" y="128" width="185" height="8" fill="#854F0B"/>
  <text x="340" y="123" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">opted_schemes</text>

  <rect x="256" y="142" width="169" height="22" rx="4" fill="#FAC775"/>
  <text x="266" y="157" font-family="Arial,sans-serif" font-size="10" fill="#412402" font-weight="600">PK  _id : ObjectId</text>

  <line x1="256" y1="166" x2="425" y2="166" stroke="#854F0B" stroke-width="0.5"/>

  <rect x="256" y="170" width="169" height="22" rx="4" fill="#FAC775" fill-opacity="0.5"/>
  <text x="266" y="185" font-family="Arial,sans-serif" font-size="10" fill="#633806" font-weight="600">FK  user_id : ObjectId</text>

  <rect x="256" y="196" width="169" height="22" rx="4" fill="#FAC775" fill-opacity="0.5"/>
  <text x="266" y="211" font-family="Arial,sans-serif" font-size="10" fill="#633806" font-weight="600">FK  scheme_id : ObjectId</text>

  <line x1="256" y1="220" x2="425" y2="220" stroke="#854F0B" stroke-width="0.5"/>

  <text x="266" y="237" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">applied_date : Date</text>
  <text x="266" y="253" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">status : Enum</text>
  <text x="266" y="269" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">  opted | applied</text>
  <text x="266" y="285" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">  approved | rejected</text>
  <text x="266" y="305" font-family="Arial,sans-serif" font-size="10" fill="#854F0B" font-style="italic">Compound IDX: user_id + scheme_id</text>
  <text x="266" y="317" font-family="Arial,sans-serif" font-size="10" fill="#854F0B" font-style="italic">(unique — prevents duplicates)</text>

  <!-- ── SCHEMES TABLE ────────────────────── -->
  <rect x="466" y="50" width="185" height="380" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="466" y="50" width="185" height="36" rx="8" fill="#0F6E56"/>
  <rect x="466" y="78" width="185" height="8" fill="#0F6E56"/>
  <text x="558" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">schemes</text>

  <rect x="474" y="92" width="169" height="22" rx="4" fill="#9FE1CB"/>
  <text x="484" y="107" font-family="Arial,sans-serif" font-size="10" fill="#085041" font-weight="600">PK  _id : ObjectId</text>

  <line x1="474" y1="116" x2="643" y2="116" stroke="#0F6E56" stroke-width="0.5"/>

  <text x="484" y="131" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">scheme_name : String</text>
  <text x="484" y="147" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">category : String  IDX</text>
  <text x="484" y="163" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">department : String</text>
  <text x="484" y="179" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">min_income : Number</text>
  <text x="484" y="195" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">max_income : Number</text>
  <text x="484" y="211" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">min_age : Number</text>
  <text x="484" y="227" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">max_age : Number</text>
  <text x="484" y="243" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">deadline : Date  IDX</text>
  <text x="484" y="259" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">documents : [String]</text>
  <text x="484" y="275" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">gender : Enum</text>
  <text x="484" y="291" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">source_id : String  IDX</text>
  <text x="484" y="307" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">last_synced : Date</text>

  <!-- ── RELATIONSHIPS ─────────────────────── -->
  <!-- users (1) → opted_schemes (many): line users right edge → opted_schemes left edge -->
  <line x1="215" y1="193" x2="248" y2="193" stroke="#888780" stroke-width="1.5"/>
  <text x="220" y="188" font-family="Arial,sans-serif" font-size="9" fill="#888">1</text>
  <text x="233" y="188" font-family="Arial,sans-serif" font-size="9" fill="#888">∞</text>
  <text x="106" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">A user opts into many schemes</text>

  <!-- schemes (1) → opted_schemes (many) -->
  <line x1="433" y1="215" x2="466" y2="215" stroke="#888780" stroke-width="1.5"/>
  <text x="436" y="210" font-family="Arial,sans-serif" font-size="9" fill="#888">∞</text>
  <text x="455" y="210" font-family="Arial,sans-serif" font-size="9" fill="#888">1</text>
  <text x="558" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">A scheme is opted by many users</text>

  <!-- Cardinality labels below tables -->
  <text x="340" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">Junction table · prevents duplicate opt-ins</text>

  <!-- Legend -->
  <rect x="30" y="460" width="620" height="30" rx="6" fill="#f9f9f9" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="46" y="470" width="10" height="10" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="62" y="479" font-family="Arial,sans-serif" font-size="10" fill="#444">PK = Primary Key</text>
  <rect x="168" y="470" width="10" height="10" rx="2" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="184" y="479" font-family="Arial,sans-serif" font-size="10" fill="#444">FK = Foreign Key</text>
  <text x="310" y="479" font-family="Arial,sans-serif" font-size="10" fill="#444">UK = Unique</text>
  <text x="390" y="479" font-family="Arial,sans-serif" font-size="10" fill="#444">IDX = Indexed</text>
  <text x="470" y="479" font-family="Arial,sans-serif" font-size="10" fill="#444">1 = one side  ∞ = many side</text>
</svg>
