<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Yojanta deployment diagram</title>
  <desc>Shows how Yojanta is deployed across Vercel (frontend), Render (backend), MongoDB Atlas (database), Google Gemini (AI), and data.gov.in (external API)</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Yojanta — Deployment Diagram</text>

  <!-- ── USER ───────────────────────── -->
  <rect x="270" y="44" width="140" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">User Browser</text>
  <text x="340" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#5F5E5A">Chrome / Firefox / Mobile</text>

  <!-- Arrow: User → Vercel -->
  <line x1="340" y1="104" x2="340" y2="134" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-b)"/>
  <text x="354" y="122" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">HTTPS</text>

  <!-- ── VERCEL ─────────────────────── -->
  <rect x="150" y="134" width="380" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="340" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">Vercel — CDN + Hosting</text>
  <text x="340" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#185FA5">React.js Production Build</text>
  <text x="340" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#378ADD">yojanta.vercel.app · Auto-deploys on git push to main</text>

  <!-- Arrow: Vercel → Render -->
  <line x1="340" y1="214" x2="340" y2="244" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow-b)"/>
  <text x="292" y="232" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">HTTPS REST API + JWT</text>

  <!-- ── RENDER ─────────────────────── -->
  <rect x="150" y="244" width="380" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="340" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#085041">Render — Cloud Server</text>
  <text x="340" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#0F6E56">Node.js + Express.js REST API</text>
  <text x="340" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1D9E75">yojanta-backend.onrender.com · Free tier (spins down after 15 min)</text>
  <rect x="170" y="314" width="140" height="22" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="240" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#085041">JWT Middleware</text>
  <rect x="320" y="314" width="140" height="22" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="390" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#085041">node-cron Sync</text>

  <!-- Arrow: Render → Atlas -->
  <line x1="240" y1="344" x2="180" y2="394" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <text x="172" y="372" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">Mongoose TLS</text>

  <!-- Arrow: Render → Gemini -->
  <line x1="480" y1="344" x2="540" y2="394" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow-p)"/>
  <text x="490" y="372" font-family="Arial,sans-serif" font-size="10" fill="#534AB7">HTTPS API call</text>

  <!-- ── ATLAS ──────────────────────── -->
  <rect x="30" y="394" width="250" height="100" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="155" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#633806">MongoDB Atlas</text>
  <text x="155" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#854F0B">Free M0 cluster · 512 MB</text>
  <rect x="46" y="450" width="72" height="34" rx="6" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <text x="82" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#412402">users</text>
  <rect x="126" y="450" width="72" height="34" rx="6" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <text x="162" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#412402">schemes</text>
  <rect x="206" y="450" width="64" height="34" rx="6" fill="#EF9F27" stroke="#854F0B" stroke-width="0.5"/>
  <text x="238" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#412402">opted</text>

  <!-- ── GEMINI ──────────────────────── -->
  <rect x="400" y="394" width="250" height="100" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="525" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#3C3489">Google Gemini API</text>
  <text x="525" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#534AB7">AI · Free tier generous</text>
  <rect x="416" y="450" width="100" height="34" rx="6" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
  <text x="466" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#EEEDFE">Chatbot</text>
  <rect x="526" y="450" width="108" height="34" rx="6" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
  <text x="580" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#EEEDFE">Embeddings</text>

  <!-- ── data.gov.in ────────────────── -->
  <rect x="200" y="518" width="280" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">data.gov.in API</text>
  <text x="340" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#5F5E5A">Government open data · daily cron sync</text>

  <!-- Arrow: data.gov.in → Render (cron) -->
  <path d="M340 518 L340 490 L390 490 L390 344" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="398" y="430" font-family="Arial,sans-serif" font-size="10" fill="#5F5E5A">daily sync</text>

  <!-- CI/CD label -->
  <rect x="30" y="510" width="155" height="52" rx="8" fill="#f9f9f9" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="107" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#444">CI / CD</text>
  <text x="107" y="543" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#888">git push → main</text>
  <text x="107" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#888">Vercel + Render auto-deploy</text>
</svg>
