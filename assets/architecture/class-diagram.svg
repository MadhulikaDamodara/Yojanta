<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Yojanta class diagram</title>
  <desc>Shows all 8 classes in Yojanta — User, Scheme, OptedScheme, EligibilityEngine, AuthService, SyncJob, NotificationService, ChatbotService — with attributes, methods and relationships</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#1a1a1a">Yojanta — Class Diagram</text>

  <!-- helper: class box macro -->
  <!-- USER -->
  <g>
    <rect x="30" y="44" width="170" height="198" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <rect x="30" y="44" width="170" height="30" rx="8" fill="#185FA5"/>
    <rect x="30" y="66" width="170" height="8" fill="#185FA5"/>
    <text x="115" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">User</text>
    <line x1="30" y1="74" x2="200" y2="74" stroke="#185FA5" stroke-width="0.5"/>
    <text x="40" y="89" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ _id : ObjectId</text>
    <text x="40" y="103" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ user_name : String</text>
    <text x="40" y="117" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ email : String</text>
    <text x="40" y="131" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ password : String</text>
    <text x="40" y="145" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ dob : Date</text>
    <text x="40" y="159" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ gender, income, state</text>
    <text x="40" y="173" font-family="Arial,sans-serif" font-size="10" fill="#0C447C">+ category : String</text>
    <line x1="30" y1="180" x2="200" y2="180" stroke="#185FA5" stroke-width="0.5"/>
    <text x="40" y="195" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">+ register()</text>
    <text x="40" y="209" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">+ login()</text>
    <text x="40" y="223" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">+ updateProfile()</text>
    <text x="40" y="237" font-family="Arial,sans-serif" font-size="10" fill="#185FA5">+ getProfile()</text>
  </g>

  <!-- SCHEME -->
  <g>
    <rect x="255" y="44" width="170" height="220" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <rect x="255" y="44" width="170" height="30" rx="8" fill="#0F6E56"/>
    <rect x="255" y="66" width="170" height="8" fill="#0F6E56"/>
    <text x="340" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">Scheme</text>
    <line x1="255" y1="74" x2="425" y2="74" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="265" y="89" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ _id : ObjectId</text>
    <text x="265" y="103" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ scheme_name : String</text>
    <text x="265" y="117" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ category : String</text>
    <text x="265" y="131" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ min/max_income : Number</text>
    <text x="265" y="145" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ min/max_age : Number</text>
    <text x="265" y="159" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ deadline : Date</text>
    <text x="265" y="173" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ documents : [String]</text>
    <text x="265" y="187" font-family="Arial,sans-serif" font-size="10" fill="#085041">+ gender, source_id</text>
    <line x1="255" y1="196" x2="425" y2="196" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="265" y="211" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">+ getAll()</text>
    <text x="265" y="225" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">+ getById()</text>
    <text x="265" y="239" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">+ create() / update()</text>
    <text x="265" y="253" font-family="Arial,sans-serif" font-size="10" fill="#0F6E56">+ archive()</text>
  </g>

  <!-- OPTED SCHEME -->
  <g>
    <rect x="480" y="44" width="175" height="176" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <rect x="480" y="44" width="175" height="30" rx="8" fill="#854F0B"/>
    <rect x="480" y="66" width="175" height="8" fill="#854F0B"/>
    <text x="567" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">OptedScheme</text>
    <line x1="480" y1="74" x2="655" y2="74" stroke="#854F0B" stroke-width="0.5"/>
    <text x="490" y="89" font-family="Arial,sans-serif" font-size="10" fill="#633806">+ _id : ObjectId</text>
    <text x="490" y="103" font-family="Arial,sans-serif" font-size="10" fill="#633806">+ user_id : ObjectId</text>
    <text x="490" y="117" font-family="Arial,sans-serif" font-size="10" fill="#633806">+ scheme_id : ObjectId</text>
    <text x="490" y="131" font-family="Arial,sans-serif" font-size="10" fill="#633806">+ applied_date : Date</text>
    <text x="490" y="145" font-family="Arial,sans-serif" font-size="10" fill="#633806">+ status : String</text>
    <line x1="480" y1="154" x2="655" y2="154" stroke="#854F0B" stroke-width="0.5"/>
    <text x="490" y="169" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">+ optIn()</text>
    <text x="490" y="183" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">+ updateStatus()</text>
    <text x="490" y="197" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">+ getByUser()</text>
    <text x="490" y="211" font-family="Arial,sans-serif" font-size="10" fill="#854F0B">+ delete()</text>
  </g>

  <!-- ELIGIBILITY ENGINE -->
  <g>
    <rect x="30" y="285" width="170" height="165" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <rect x="30" y="285" width="170" height="30" rx="8" fill="#534AB7"/>
    <rect x="30" y="307" width="170" height="8" fill="#534AB7"/>
    <text x="115" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">EligibilityEngine</text>
    <line x1="30" y1="315" x2="200" y2="315" stroke="#534AB7" stroke-width="0.5"/>
    <text x="40" y="330" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ matchSchemes(user)</text>
    <text x="40" y="344" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ calculateAge(dob)</text>
    <text x="40" y="358" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ buildQuery(profile)</text>
    <text x="40" y="372" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ filterByAge()</text>
    <text x="40" y="386" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ filterByIncome()</text>
    <text x="40" y="400" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ filterByGender()</text>
    <text x="40" y="414" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ filterByDeadline()</text>
    <text x="40" y="428" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ filterByCategory()</text>
  </g>

  <!-- AUTH SERVICE -->
  <g>
    <rect x="255" y="305" width="170" height="155" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <rect x="255" y="305" width="170" height="30" rx="8" fill="#3B6D11"/>
    <rect x="255" y="327" width="170" height="8" fill="#3B6D11"/>
    <text x="340" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">AuthService</text>
    <line x1="255" y1="335" x2="425" y2="335" stroke="#3B6D11" stroke-width="0.5"/>
    <text x="265" y="350" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ register(userData)</text>
    <text x="265" y="364" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ login(email, pwd)</text>
    <text x="265" y="378" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ hashPassword()</text>
    <text x="265" y="392" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ comparePassword()</text>
    <text x="265" y="406" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ generateToken()</text>
    <text x="265" y="420" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ verifyToken()</text>
    <text x="265" y="434" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ refreshToken()</text>
    <text x="265" y="448" font-family="Arial,sans-serif" font-size="10" fill="#27500A">+ logout()</text>
  </g>

  <!-- SYNC JOB -->
  <g>
    <rect x="480" y="285" width="175" height="145" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <rect x="480" y="285" width="175" height="30" rx="8" fill="#A32D2D"/>
    <rect x="480" y="307" width="175" height="8" fill="#A32D2D"/>
    <text x="567" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">SyncJob</text>
    <line x1="480" y1="315" x2="655" y2="315" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="490" y="330" font-family="Arial,sans-serif" font-size="10" fill="#791F1F">- schedule: String</text>
    <line x1="480" y1="337" x2="655" y2="337" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="490" y="352" font-family="Arial,sans-serif" font-size="10" fill="#A32D2D">+ run()</text>
    <text x="490" y="366" font-family="Arial,sans-serif" font-size="10" fill="#A32D2D">+ fetchFromGovAPI()</text>
    <text x="490" y="380" font-family="Arial,sans-serif" font-size="10" fill="#A32D2D">+ normalizeData()</text>
    <text x="490" y="394" font-family="Arial,sans-serif" font-size="10" fill="#A32D2D">+ upsertSchemes()</text>
    <text x="490" y="408" font-family="Arial,sans-serif" font-size="10" fill="#A32D2D">+ logResults()</text>
  </g>

  <!-- NOTIFICATION SERVICE -->
  <g>
    <rect x="30" y="500" width="170" height="135" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <rect x="30" y="500" width="170" height="30" rx="8" fill="#5F5E5A"/>
    <rect x="30" y="522" width="170" height="8" fill="#5F5E5A"/>
    <text x="115" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#fff">NotificationService</text>
    <line x1="30" y1="530" x2="200" y2="530" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="40" y="545" font-family="Arial,sans-serif" font-size="10" fill="#444441">+ checkDeadlines()</text>
    <text x="40" y="559" font-family="Arial,sans-serif" font-size="10" fill="#444441">+ createAlert(userId)</text>
    <text x="40" y="573" font-family="Arial,sans-serif" font-size="10" fill="#444441">+ getByUser(userId)</text>
    <text x="40" y="587" font-family="Arial,sans-serif" font-size="10" fill="#444441">+ markRead(id)</text>
    <text x="40" y="601" font-family="Arial,sans-serif" font-size="10" fill="#444441">+ sendEmail()</text>
    <text x="40" y="615" font-family="Arial,sans-serif" font-size="10" fill="#444441">+ sendSMS()</text>
  </g>

  <!-- CHATBOT SERVICE -->
  <g>
    <rect x="480" y="480" width="175" height="135" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <rect x="480" y="480" width="175" height="30" rx="8" fill="#534AB7"/>
    <rect x="480" y="502" width="175" height="8" fill="#534AB7"/>
    <text x="567" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">ChatbotService</text>
    <line x1="480" y1="510" x2="655" y2="510" stroke="#534AB7" stroke-width="0.5"/>
    <text x="490" y="525" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ sendMessage(msg)</text>
    <text x="490" y="539" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ buildPrompt()</text>
    <text x="490" y="553" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ callGeminiAPI()</text>
    <text x="490" y="567" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ parseResponse()</text>
    <text x="490" y="581" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ generateEmbedding()</text>
    <text x="490" y="595" font-family="Arial,sans-serif" font-size="10" fill="#3C3489">+ cosineSimilarity()</text>
  </g>

  <!-- Relationship arrows -->
  <!-- User 1→many OptedScheme -->
  <line x1="200" y1="100" x2="480" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="94" font-family="Arial,sans-serif" font-size="9" fill="#888">1 opts into many</text>

  <!-- Scheme 1→many OptedScheme -->
  <line x1="425" y1="140" x2="480" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="133" font-family="Arial,sans-serif" font-size="9" fill="#888">1 to many</text>

  <!-- EligibilityEngine → User -->
  <line x1="115" y1="285" x2="115" y2="242" stroke="#888780" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow-d)"/>
  <text x="120" y="268" font-family="Arial,sans-serif" font-size="9" fill="#aaa">reads</text>

  <!-- EligibilityEngine → Scheme -->
  <line x1="200" y1="340" x2="255" y2="180" stroke="#888780" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow-d)"/>
  <text x="190" y="280" font-family="Arial,sans-serif" font-size="9" fill="#aaa">queries</text>

  <!-- AuthService → User -->
  <line x1="340" y1="305" x2="200" y2="180" stroke="#888780" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow-d)"/>
  <text x="252" y="254" font-family="Arial,sans-serif" font-size="9" fill="#aaa">manages</text>

  <!-- SyncJob → Scheme -->
  <line x1="567" y1="285" x2="400" y2="200" stroke="#888780" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arrow-d)"/>
  <text x="470" y="246" font-family="Arial,sans-serif" font-size="9" fill="#aaa">upserts</text>
</svg>
